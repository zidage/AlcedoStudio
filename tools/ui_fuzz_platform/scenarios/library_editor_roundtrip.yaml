name: library_editor_roundtrip
start: workspace_ready
defaults:
  expectTimeoutMs: 10000
nodes:
  workspace_ready:
    op:
      action: wait
      target: workspaceHost
      property: visible
      eq: true
    next:
      - to: open_first_image
        weight: 1
  open_first_image:
    op:
      action: doubleClick
      target: thumbnailGridView_firstCard
    expect:
      - target: editorWorkspace
        property: visible
        eq: true
    next:
      - to: back_to_library
        weight: 1
  back_to_library:
    op:
      action: click
      target: libraryNavButton
    expect:
      - target: libraryWorkspace
        property: visible
        eq: true
    next:
      - to: reenter_editor
        weight: 1
  reenter_editor:
    op:
      action: click
      target: editorNavButton
    expect:
      - target: editorWorkspace
        property: visible
        eq: true
    next:
      - to: capture_editor
        weight: 1
  capture_editor:
    op:
      action: screenshot
