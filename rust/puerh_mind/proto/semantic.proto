syntax = "proto3";

package semantic;

import "ai_common.proto";

service SemanticService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc EmbedText(EmbedTextRequest) returns (EmbeddingResponse);
  rpc EmbedImage(EmbedImageRequest) returns (EmbeddingResponse);
  rpc EmbedTextBatch(EmbedTextBatchRequest) returns (EmbeddingBatchResponse);
  rpc EmbedImageBatch(EmbedImageBatchRequest) returns (EmbeddingBatchResponse);
  // v2 embedding RPCs (Phase 4): carry the shared AI control-surface headers
  // (alcedo.ai.AiRequestHeader / AiResponseHeader) inline. v1 RPCs above stay frozen; the C++
  // host migrates call sites to v2 with an automatic v1 fallback (Phase 0 contract §2.3).
  rpc EmbedTextV2(EmbedTextRequestV2) returns (EmbeddingResponseV2);
  rpc EmbedImageV2(EmbedImageRequestV2) returns (EmbeddingResponseV2);
  rpc EmbedTextBatchV2(EmbedTextBatchRequestV2) returns (EmbeddingBatchResponseV2);
  rpc EmbedImageBatchV2(EmbedImageBatchRequestV2) returns (EmbeddingBatchResponseV2);
  rpc GetModelInfo(GetModelInfoRequest) returns (GetModelInfoResponse);
  rpc GetRuntimeStatus(GetRuntimeStatusRequest) returns (GetRuntimeStatusResponse);
}

service ModelManagerService {
  rpc ListModelProfiles(ListModelProfilesRequest) returns (ListModelProfilesResponse);
  rpc ListInstalledModels(ListInstalledModelsRequest) returns (ListInstalledModelsResponse);
  rpc ValidateModel(ValidateModelRequest) returns (ModelManagerResponse);
  rpc DeleteModel(DeleteModelRequest) returns (ModelManagerResponse);
}

message PingRequest {
  string request_id = 1;
}

message PingResponse {
  string request_id = 1;
  string message = 2;
  uint64 elapsed_ms = 3;
}

message EmbedTextRequest {
  string request_id = 1;
  string text = 2;
  string model_name = 3;
}

message EmbedImageRequest {
  string request_id = 1;
  bytes image_bytes = 2;
  string image_format_hint = 3; // raw "rgba8:WxH", for example "rgba8:256x256"
  string model_name = 4;
}

message EmbedTextBatchRequest {
  repeated EmbedTextRequest items = 1;
}

message EmbedImageBatchRequest {
  repeated EmbedImageRequest items = 1;
}

message EmbeddingResponse {
  string request_id = 1;
  repeated float embedding = 2;
  uint32 dimension = 3;
  string model_name = 4;
  uint64 elapsed_ms = 5;
}

message EmbeddingBatchItem {
  string request_id = 1;
  repeated float embedding = 2;
  uint32 dimension = 3;
  string model_name = 4;
  uint64 elapsed_ms = 5;
  bool ok = 6;
  string error = 7;
}

message EmbeddingBatchResponse {
  repeated EmbeddingBatchItem items = 1;
  uint64 elapsed_ms = 2;
}

// v2 embedding messages (Phase 4): the shared AI control-surface headers ride inline. Single-call
// correlation is header.request_id (no body request_id); batch items keep a per-item request_id
// that the C++ host maps back to file identity, unchanged from the v1 EmbeddingBatchItem shape.
message EmbedTextRequestV2 {
  alcedo.ai.AiRequestHeader header = 1;
  string text = 2;
  string model_name = 3;
}

message EmbedImageRequestV2 {
  alcedo.ai.AiRequestHeader header = 1;
  bytes image_bytes = 2;
  string image_format_hint = 3;
  string model_name = 4;
}

message EmbedTextItemV2 {
  string request_id = 1;
  string text = 2;
  string model_name = 3;
}

message EmbedImageItemV2 {
  string request_id = 1;
  bytes image_bytes = 2;
  string image_format_hint = 3;
  string model_name = 4;
}

message EmbedTextBatchRequestV2 {
  alcedo.ai.AiRequestHeader header = 1;
  repeated EmbedTextItemV2 items = 2;
}

message EmbedImageBatchRequestV2 {
  alcedo.ai.AiRequestHeader header = 1;
  repeated EmbedImageItemV2 items = 2;
}

message EmbeddingResponseV2 {
  alcedo.ai.AiResponseHeader header = 1;
  repeated float embedding = 2;
  uint32 dimension = 3;
  string model_name = 4;
  uint64 elapsed_ms = 5;
}

message EmbeddingBatchItemV2 {
  string request_id = 1;
  repeated float embedding = 2;
  uint32 dimension = 3;
  string model_name = 4;
  uint64 elapsed_ms = 5;
  bool ok = 6;
  string error = 7;
}

message EmbeddingBatchResponseV2 {
  alcedo.ai.AiResponseHeader header = 1;
  repeated EmbeddingBatchItemV2 items = 2;
  uint64 elapsed_ms = 3;
}

message GetModelInfoRequest {}

message GetModelInfoResponse {
  string model_id = 1;
  string revision = 2;
  uint32 embedding_dimension = 3;
  uint32 image_size = 4;
  string provider = 5;
  string model_root = 6;
  string prototype_config_hash = 7;
  string profile_id = 8;
  string engine_profile_id = 9;
  string language = 10;
  uint32 native_embedding_dimension = 11;
  string embedding_transform = 12;
}

message GetRuntimeStatusRequest {}

message GetRuntimeStatusResponse {
  string state = 1;
  string provider = 2;
  uint32 image_batch_cap = 3;
  uint32 image_batch_wait_ms = 4;
  uint64 uptime_ms = 5;
  // One entry per encoder of the model: text and image, or one multimodal session.
  repeated EncoderResidencyStatus encoders = 6;
}

message EncoderResidencyStatus {
  string encoder = 1;  // text, image, or multimodal
  bool loaded = 2;
  string device = 3;
  uint64 idle_ms = 4;  // time since the last request; 0 before the first request
}

message ModelAsset {
  string role = 1;
  string repo_id = 2;
  string revision = 3;
  string remote_path = 4;
  string local_path = 5;
  uint64 size_bytes = 6;
  string sha256 = 7;
}

message ModelProfile {
  string profile_id = 1;
  string display_name = 2;
  string model_id = 3;
  string revision = 4;
  string engine_profile_id = 5;
  string language = 6; // en, zh, or multilingual
  uint32 embedding_dimension = 7;
  uint32 native_embedding_dimension = 8;
  uint32 image_size = 9;
  bool installed = 10;
  string local_root = 11;
  string status = 12;
  repeated ModelAsset assets = 13;
  string embedding_transform = 14;
}

message ResolvedModelManifest {
  string profile_id = 1;
  string model_id = 2;
  string revision = 3;
  string engine_profile_id = 4;
  string language = 5;
  uint32 embedding_dimension = 6;
  uint32 native_embedding_dimension = 7;
  uint32 image_size = 8;
  string model_root = 9;
  repeated ModelAsset assets = 10;
  string embedding_transform = 11;
}

message ListModelProfilesRequest {
  string model_root = 1;
}

message ListModelProfilesResponse {
  repeated ModelProfile profiles = 1;
}

message ListInstalledModelsRequest {
  string model_root = 1;
}

message ListInstalledModelsResponse {
  repeated ModelProfile profiles = 1;
}

message ValidateModelRequest {
  string profile_id = 1;
  string model_root = 2;
}

message DeleteModelRequest {
  string profile_id = 1;
  string model_root = 2;
}

message ModelManagerResponse {
  bool ok = 1;
  string status = 2;
  string error = 3;
  ModelProfile profile = 4;
  ResolvedModelManifest manifest = 5;
}
