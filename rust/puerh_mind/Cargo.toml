[package]
name = "alcedo_mind"
version = "0.1.0"
edition = "2024"

[dependencies]
tonic = "0.14"
tonic-reflection = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
mini-redis = "0.4"
prost = "0.14"
prost-types = "0.14"
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
image = "0.25.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
# ONNX Runtime 1.28 or later: ONNX Runtime 1.24 to 1.27 fold the two `If` nodes of the SAM 2.1
# tiny image encoder into freed memory (microsoft/onnxruntime#29071), so the AI Mask encoder output
# is wrong. `ort` 2.0.0-rc.13 is the last release that builds with Rust 1.91. The pyke binaries
# are split by execution provider, so DirectML and Core ML are target-specific features below.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "api-28", "tls-rustls"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["directml"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["coreml"] }
apple-cf = "0.9.3"
coreml = "0.3.5"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
tonic-prost-build = "0.14"
