syntax = "proto3";

package alcedo.ai;

import "ai_common.proto";

// Sidecar-level capability and runtime control service.
//
// ListCapabilities lets the C++ host discover what task types this sidecar can
// serve, via the shared AiCapability descriptor. The header is carried for
// uniform request correlation, but task_id, credential_ref, and timeout_ms are
// ignored for this RPC.
//
// RegisterCredential mints an opaque credential handle backed by the Rust-side
// in-memory vault; only the handle travels in subsequent task headers
// (AiRequestHeader.credential_ref), never the secret. CancelTask cancels an
// in-flight task by request_id. Both land in Phase 3.
service AiRuntimeService {
  rpc ListCapabilities(ListCapabilitiesRequest) returns (ListCapabilitiesResponse);
  rpc RegisterCredential(RegisterCredentialRequest) returns (RegisterCredentialResponse);
  rpc RevokeCredential(RevokeCredentialRequest) returns (RevokeCredentialResponse);
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
}

message ListCapabilitiesRequest {
  AiRequestHeader header = 1;
}

message ListCapabilitiesResponse {
  AiResponseHeader header = 1;
  repeated AiCapability capabilities = 2;
}

message RegisterCredentialRequest {
  AiRequestHeader header      = 1;
  string          provider_id = 2;  // e.g. "openai"; identifies the provider scope
  string          secret      = 3;  // long-lived provider key; never echoed in responses
  int64           ttl_ms      = 4;  // 0 = server default; >0 = explicit TTL; <0 = invalid
}

message RegisterCredentialResponse {
  AiResponseHeader header            = 1;
  string           credential_handle = 2;  // opaque UUID; the secret is never echoed back
}

// Phase 6c: revoke a previously-registered credential handle so it can no longer
// be resolved by task RPCs. Used by the host on provider logout, settings
// deletion, sidecar stop, and project close. Idempotent: revoking an unknown or
// already-revoked handle returns `revoked = false` but status OK.
message RevokeCredentialRequest {
  AiRequestHeader header            = 1;
  string          credential_handle = 2;  // the opaque handle to revoke
}

message RevokeCredentialResponse {
  AiResponseHeader header  = 1;
  bool             revoked = 2;  // true = a live handle was revoked
}

message CancelTaskRequest {
  AiRequestHeader header      = 1;  // header.request_id = this cancel call's correlation
  string          request_id  = 2;  // the in-flight task to cancel
}

message CancelTaskResponse {
  AiResponseHeader header    = 1;
  bool             cancelled = 2;  // false = no such in-flight task currently registered
}
