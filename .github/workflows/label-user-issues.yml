name: Label user issues

# An issue from a user or an outside contributor gets the "from: user" label,
# so that maintainers find user reports apart from their own work items.

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    if: >-
      github.event.issue.user.type != 'Bot' &&
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Add the from user label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$NUMBER" --repo "$REPO" --add-label "from: user"
