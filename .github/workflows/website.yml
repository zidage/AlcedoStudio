name: Deploy Website to GitHub Pages

# Single deploy entry for docs/alcedo-website/site/ (plain static HTML).
# No Node, Vite, or build step — site/ is the production source.

on:
  push:
    branches: [main]
    paths:
      - "docs/alcedo-website/site/**"
      - "docs/alcedo-website/scripts/verify_site.py"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify static site
        run: python3 docs/alcedo-website/scripts/verify_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/alcedo-website/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
